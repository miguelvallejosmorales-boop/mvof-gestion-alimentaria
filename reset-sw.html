<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MVOF · Reset PWA</title>
<style>
  body{font-family:'Inter',system-ui,sans-serif;background:#F6F8F6;color:#141C18;
    display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:20px}
  .card{background:#fff;border:1px solid #E7EBE8;border-radius:20px;padding:32px;max-width:420px;
    box-shadow:0 12px 30px rgba(20,28,24,.08);text-align:center}
  h1{font-size:20px;margin:0 0 8px;color:#3D5449}
  p{color:#6E7B75;font-size:14px;line-height:1.6}
  .btn{display:block;width:100%;margin-top:14px;padding:12px;border-radius:12px;border:0;
    font-weight:650;font-size:14px;cursor:pointer}
  .p{background:linear-gradient(180deg,#5B7C6E,#45695A);color:#fff}
  .s{background:#fff;color:#141C18;border:1px solid #D8E0DB}
  #out{margin-top:14px;font-size:12px;color:#5B7C6E}
</style></head>
<body>
<div class="card">
  <h1>🔧 Reset MVOF PWA</h1>
  <p>Si la app falla (pantalla vieja, error de conexión, no carga), toca el botón para desregistrar el Service Worker y limpiar la caché local.</p>
  <button class="btn p" onclick="reset()">🗑️ Desregistrar SW y limpiar caché</button>
  <a class="btn s" href="/">🏠 Ir a la app</a>
  <div id="out"></div>
</div>
<script>
async function reset(){
  const out=document.getElementById("out");
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs) await r.unregister();
    }
    if(window.caches){ const ks=await caches.keys(); for(const k of ks) await caches.delete(k); }
    out.textContent="✅ Listo. Redirigiendo...";
    setTimeout(()=>location.href="/",900);
  }catch(e){ out.textContent="Error: "+e.message; }
}
</script>
</body></html>
